# Development only: privileged execution of untrusted code is not a production security boundary.
x-judge0-poc: &judge0-poc
  image: ${JUDGE0_IMAGE:-judge0-arm64:1.13.1-dev.1}
  platform: linux/arm64
  privileged: true
  cgroup: host
  volumes:
    - ./judge0.conf:/judge0.conf:ro
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
  restart: unless-stopped

services:
  server:
    <<: *judge0-poc
    ports:
      - "2359:2358"

  workers:
    <<: *judge0-poc
    command: ["./scripts/workers"]

  db:
    image: postgres:16.2
    platform: linux/arm64
    env_file: judge0.conf
    volumes:
      - judge0-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.2.4
    platform: linux/arm64
    command: ["bash", "-c", "docker-entrypoint.sh --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    env_file: judge0.conf
    restart: unless-stopped

volumes:
  judge0-data:

